# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}

# HikariCP Connection Pool Configuration
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME}
spring.datasource.hikari.connection-test-query=${SPRING_DATASOURCE_HIKARI_CONNECTION_TEST_QUERY}

# Swagger Configuration
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}

# File Upload Configuration
spring.web.resources.static-locations=${SPRING_WEB_RESOURCES_STATIC_LOCATIONS}
file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

# SMS Configuration (LMT Group)
lmt.accountSid=${LMT_ACCOUNTSID}
lmt.authToken=${LMT_AUTHTOKEN}
lmt.sender=${LMT_SENDER}
lmt.url=${LMT_URL}

# Email Configuration
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

# Images Configuration
unfpaphoto=${UNFPAPHOTO}
young=${YOUNG}

# Weather API Configuration
weather.website=${WEATHER_WEBSITE}
weather.key=${WEATHER_KEY}
weather.url=${WEATHER_URL}

# Server Configuration
server.port=${SERVER_PORT}
spring.jmx.enabled=${SPRING_JMX_ENABLED}

